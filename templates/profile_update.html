{% extends 'index.html' %}
{% load bootstrap %}

{% block navbar_search %}
{% endblock %}

{% block navbar_menu %}
  <form class="form-inline" action="{% url 'profile_detail' slug=profile.slug %}">
    <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Вернуться к карточке</button>
  </form>
{% endblock %}

    {% block body %}
    
    <form class="form-horizontal" action="" method="POST" enctype="multipart/form-data">
        <legend class="col-sm-10 col-sm-offset-2">Редактирование сотрудника</legend>
        {% csrf_token %}
        {{ form|bootstrap_horizontal }}
        <div class="form-group">
          <div class="col-sm-10 col-sm-offset-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </div>
    </form>

    {% block paging %}
    {% endblock %}

    {% endblock %}
