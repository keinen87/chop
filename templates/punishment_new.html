{% extends 'index.html' %}
{% load bootstrap %}

{% block navbar_search %}
{% endblock %}

{% block navbar_menu %}
{% endblock %}

    {% block body %}

    <form class="form-horizontal" action="" method="POST">
        <legend class="col-sm-10 col-sm-offset-2 text-muted">Новое взыскание</legend>
        {% csrf_token %}
        {{ form|bootstrap_horizontal }}   
        <div class="form-group">
            <div class="col-sm-10 col-sm-offset-2">
              <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </div>
    </form>


    {% block paging %}
    {% endblock %}

    {% endblock %}
    
    {% block script %}
    <script>
      $(function () {
          $('.date-input').datetimepicker({
            defaultDate: new Date(),
            format:'YYYY-MM-DD',
            locale: 'ru',
          });


      });

    </script>
    {% endblock%}
